<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Space Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Helvetica Neue',Arial,sans-serif;color:#fff;touch-action:none;}
canvas{display:block;}
#ui-top{position:fixed;top:0;left:0;right:0;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.85)0%,transparent 100%);display:flex;align-items:center;justify-content:space-between;z-index:10;pointer-events:none;}
#title{font-size:13px;font-weight:700;letter-spacing:3px;color:#88ccff;}
#obj-count{font-size:11px;color:#556677;}
#mode-bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;}
.mbtn{padding:9px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.7);color:#aaa;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;white-space:nowrap;}
.mbtn.active{background:rgba(0,80,200,.5);border-color:#44aaff;color:#88ccff;}
#panel{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,rgba(0,8,24,.97)0%,rgba(0,8,24,.9)100%);border-top:1px solid rgba(80,140,255,.25);padding:16px 16px 24px;z-index:20;transform:translateY(100%);transition:transform .3s ease;max-height:50vh;overflow-y:auto;}
#panel.open{transform:translateY(0);}
#pname{font-size:17px;font-weight:700;color:#88ccff;margin-bottom:3px;}
#ptype{font-size:11px;color:#5588aa;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
#pdesc{font-size:13px;color:#bbc;line-height:1.6;}
#pstats{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sbox{background:rgba(255,255,255,.05);padding:8px 10px;border-radius:6px;}
.slbl{font-size:10px;color:#556677;letter-spacing:1px;text-transform:uppercase;}
.sval{font-size:13px;color:#dde;font-weight:600;margin-top:2px;}
#pclose{position:absolute;top:14px;right:14px;font-size:22px;cursor:pointer;color:#446;line-height:1;}
#legend{position:fixed;top:48px;right:8px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 12px;z-index:10;font-size:11px;}
#legend h4{font-size:9px;color:#446;letter-spacing:1px;margin-bottom:7px;text-transform:uppercase;}
.li{display:flex;align-items:center;gap:7px;color:#99a;margin-bottom:5px;}
.ld{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
#hint{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.3);pointer-events:none;white-space:nowrap;}
</style>
</head>
<body>
<div id="ui-top">
  <div id="title">◈ SPACE MAP 3D</div>
  <div id="obj-count">Loading…</div>
</div>
<div id="legend">
  <h4>Object Types</h4>
  <div class="li"><div class="ld" style="background:#DDEEFF"></div>O/B Blue Giant</div>
  <div class="li"><div class="ld" style="background:#CCDDFF"></div>A White Star</div>
  <div class="li"><div class="ld" style="background:#FFFFCC"></div>F Yellow-White</div>
  <div class="li"><div class="ld" style="background:#FFFF44"></div>G Yellow Dwarf</div>
  <div class="li"><div class="ld" style="background:#FFAA00"></div>K Orange Dwarf</div>
  <div class="li"><div class="ld" style="background:#FF4400"></div>M Red Dwarf</div>
  <div class="li"><div class="ld" style="background:#882200"></div>Brown Dwarf</div>
  <div class="li"><div class="ld" style="background:#AAAAFF"></div>White Dwarf</div>
  <div class="li"><div class="ld" style="background:#44FFAA"></div>Planet / Comet</div>
</div>
<div id="mode-bar">
  <button class="mbtn" id="btn-solar" onclick="setMode('solar')">☀ Solar System</button>
  <button class="mbtn active" id="btn-stars" onclick="setMode('stars')">✦ Stellar (20 ly)</button>
  <button class="mbtn" id="btn-galaxy" onclick="setMode('galaxy')">⬡ Galaxy Scale</button>
</div>
<div id="hint">Drag to rotate · Pinch to zoom · Tap any object for data</div>
<div id="panel">
  <div id="pclose" onclick="closePanel()">✕</div>
  <div id="pname"></div>
  <div id="ptype"></div>
  <div id="pdesc"></div>
  <div id="pstats"></div>
</div>

   desc:"Egg-shaped due to rapid rotation (once every 3.9 hours) — one of the fastest-rotating large objects in the solar system. Two moons (Hiʻiaka, Namaka) and a ring system discovered 2017.",
   stats:{"Orbit":"43.1 AU","Shape":"2,100×1,700×1,000 km","Moons":"2 + ring","Year":"285 Earth years"}},
  {name:"Makemake",au:45.8,col:"#CC9966",sz:0.22,type:"Dwarf Planet — Kuiper Belt",
   desc:"Bright methane ice surface. Third largest dwarf planet. One known moon (MK2) discovered 2016. No detectable atmosphere. One of the brightest trans-Neptunian objects.",
   stats:{"Orbit":"45.8 AU","Diameter":"~1,430 km","Moons":"1 (MK2)","Year":"305 Earth years"}},
  {name:"Eris",au:67.8,col:"#DDDDDD",sz:0.27,type:"Dwarf Planet — Scattered Disc",
   desc:"Most massive known dwarf planet. Its 2005 discovery triggered the 2006 reclassification of Pluto. Surface of methane frost, making it extremely reflective. One moon, Dysnomia. Currently near aphelion.",
   stats:{"Orbit":"~68 AU (avg)","Diameter":"~2,326 km","Moons":"1 (Dysnomia)","Year":"559 Earth years"}},
  {name:"3I/ATLAS ★",au:7.2,col:"#00FFAA",sz:0.35,type:"Interstellar Comet — Visitor",
   desc:"Third known interstellar object to pass through our solar system. Discovered July 1, 2025 by ATLAS telescope in Chile. Currently exiting past Jupiter (March 2026). Contains anomalous heavy water (high D/H ratio) unlike any solar system body. JWST mapped its chemistry. Age: ~4.6 billion years; origin: Milky Way thick disk.",
   stats:{"Discovery":"July 1, 2025 (ATLAS, Chile)","Nucleus":"440 m – 5.6 km","Status":"Exiting solar system (past Jupiter)","Chemistry":"Anomalous heavy water — alien origin"}},
];

const DEEP = [
  {name:"Sagittarius A*",x:0,y:0,z:0,col:"#FF8800",sz:1200,type:"Supermassive Black Hole — Milky Way Center",
   desc:"The supermassive black hole at the center of our Milky Way galaxy. Mass: 4.1 million solar masses. First directly photographed by the Event Horizon Telescope (EHT) collaboration in 2022. Emits flares of infrared and X-ray radiation.",
   stats:{"Distance from Sun":"26,700 ly","Mass":"4.1 million M☉","Photographed":"EHT 2022","Event horizon":"~24 million km"}},
  {name:"Our Solar System",x:26700,y:0,z:0,col:"#FFFF44",sz:400,type:"G2V Star System — Orion Arm, Milky Way",
   desc:"Our Sun's position in the Milky Way: located in the Orion Arm (a minor spiral arm), ~26,700 light-years from the galactic center, ~20 light-years above the galactic midplane. One galactic orbit ('cosmic year') takes ~225 million years.",
   stats:{"Galactic distance":"26,700 ly from center","Galactic arm":"Orion Arm (Orion Spur)","Galactic orbit":"~225 million years","Above plane":"~20 ly"}},
  {name:"Andromeda Galaxy (M31)",x:-30000,y:15000,z:180000,col:"#AABBFF",sz:5000,type:"Barred Spiral Galaxy — Local Group",
   desc:"Our nearest large galactic neighbor. Contains ~1 trillion stars. On a direct collision course with the Milky Way — they will merge in approximately 4.5 billion years. Visible to the naked eye from dark skies. Has two large satellite galaxies (M32, M110).",
   stats:{"Distance":"2.537 million ly","Stars":"~1 trillion","Diameter":"~220,000 ly","Collision":"In ~4.5 Gyr — will merge with Milky Way"}},

   desc:"Satellite galaxy of the Milky Way visible from southern hemisphere. Contains ~30 billion stars. Home to the Tarantula Nebula — the largest and most active star-forming region in the Local Group. Interacts gravitationally with the Milky Way.",
   stats:{"Distance":"160,000 ly","Stars":"~30 billion","Notable":"Tarantula Nebula (30 Doradus)","Status":"Milky Way satellite"}},
  {name:"Small Magellanic Cloud",x:30000,y:-85000,z:55000,col:"#BBAAFF",sz:2000,type:"Irregular Dwarf Galaxy — Milky Way Satellite",
   desc:"Smaller companion to the Large Magellanic Cloud. Contains ~3 billion stars. Both Magellanic Clouds are slowly being consumed by the Milky Way's gravity. Visible as a faint cloud from southern hemisphere.",
   stats:{"Distance":"197,000 ly","Stars":"~3 billion","Status":"Milky Way satellite","Type":"Irregular dwarf galaxy"}},
  {name:"M87 / Virgo A",x:-10000,y:20000,z:400000,col:"#FFAA66",sz:4000,type:"Giant Elliptical Galaxy — Virgo Cluster",
   desc:"Giant elliptical galaxy at the heart of the Virgo Cluster. Contains the first black hole ever directly photographed (M87*, 6.5 billion solar masses, EHT 2019). Shoots a bright relativistic jet 5,000 light-years long. Contains 1–2 trillion stars.",
   stats:{"Distance":"~53.5 million ly","Black Hole":"6.5 billion M☉","BH Imaged":"EHT 2019 (first ever)","Jet":"5,000 ly relativistic plasma jet"}},

// ─────────────────────────────────────────────
// THREE.JS SETUP
// ─────────────────────────────────────────────
let scene, camera, renderer, controls;
let sceneObjects = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

init(); animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000005);
  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.001, 2000000);
  camera.position.set(5, 18, 38);
  renderer = new THREE.WebGLRenderer({antialias: devicePixelRatio < 2});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.minDistance = 0.01; controls.maxDistance = 800000;
  makeBG();
  buildStars();
  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('click', onClick);
  renderer.domElement.addEventListener('touchend', onTouch, {passive:true});
}

// ─────────────────────────────────────────────
// BACKGROUND STARFIELD
// ─────────────────────────────────────────────
function makeBG() {
  const N = 4000;
  const pos = new Float32Array(N*3);
  const col = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1), r=900000+Math.random()*100000;
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.sin(ph)*Math.sin(th); pos[i*3+2]=r*Math.cos(ph);
    const t=Math.random();
    if(t<0.25){col[i*3]=0.6;col[i*3+1]=0.7;col[i*3+2]=1.0;}
    else if(t<0.5){col[i*3]=1;col[i*3+1]=1;col[i*3+2]=1;}
    else if(t<0.8){col[i*3]=1;col[i*3+1]=0.9;col[i*3+2]=0.7;}
    else{col[i*3]=1;col[i*3+1]=0.5;col[i*3+2]=0.3;}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({size:2,sizeAttenuation:false,vertexColors:true})));
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function rd2xyz(ra,dec,d){
  const r=ra*Math.PI/12, de=dec*Math.PI/180;
  return new THREE.Vector3(d*Math.cos(de)*Math.cos(r), d*Math.sin(de), -d*Math.cos(de)*Math.sin(r));
}

function hex(h){return new THREE.Color(h);}

function clear(){
  for(const o of sceneObjects){
    scene.remove(o);
    if(o.geometry)o.geometry.dispose();
    if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose();}
  }
  sceneObjects=[];
}

function add(o){scene.add(o);sceneObjects.push(o);return o;}

function sphere(r,col,seg=10){
  return new THREE.Mesh(new THREE.SphereGeometry(r,seg,seg),new THREE.MeshBasicMaterial({color:hex(col)}));
}

function glow(pos,col,sz){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const cx=c.getContext('2d'),g=cx.createRadialGradient(32,32,0,32,32,32),cc=new THREE.Color(col);
  g.addColorStop(0,`rgba(${Math.round(cc.r*255)},${Math.round(cc.g*255)},${Math.round(cc.b*255)},0.9)`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=g; cx.fillRect(0,0,64,64);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  sp.position.copy(pos); sp.scale.set(sz,sz,1); sp.userData.noclick=true;
  return sp;
}

function label(txt,x,y,z,col,sc=1){
  const c=document.createElement('canvas'); c.width=256; c.height=48;
  const cx=c.getContext('2d');
  cx.font='bold 18px Arial'; cx.fillStyle=col||'#fff'; cx.textAlign='center'; cx.textBaseline='middle';
  txt.split('\n').forEach((l,i,a)=>cx.fillText(l,128,24+(i-(a.length-1)/2)*20));
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  sp.position.set(x,y,z); sp.scale.set(sc*5.5,sc*1.1,1); sp.userData.noclick=true;
  return sp;
}

function ring(r,col,op=0.5){
  const m=new THREE.Mesh(new THREE.RingGeometry(r*.98,r*1.02,72),new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide,transparent:true,opacity:op}));
  m.rotation.x=-Math.PI/2; m.userData.noclick=true; return m;
}

// ─────────────────────────────────────────────
// BUILD STELLAR NEIGHBORHOOD
// ─────────────────────────────────────────────
function buildStars(){
  clear();
  add(new THREE.GridHelper(50,20,0x111122,0x111122)).userData.noclick=true;
  for(const r of [5,10,15,20,25]){
    add(ring(r,0x223344));
    add(label(`${r} ly`, r+0.4,0.1,0,'#334455',0.45));
  }
  for(const s of STARS){
    const pos=s.dist<0.001?new THREE.Vector3():rd2xyz(s.ra,s.dec,s.dist);
    const ds=Math.max(0.15,Math.min(s.sz*0.22,0.9));
    const m=sphere(ds,s.col);
    m.position.copy(pos);
    m.userData={...s,_pos:pos.clone()};
    add(m);
    if(s.sz>1.2||s.name==='Sun') add(glow(pos,s.col,ds*5));
    add(label(s.name.replace(' A/B','').replace(/ [AB]$/,''),pos.x,pos.y+ds+0.35,pos.z,s.col,0.45));
  }
  const sl=new THREE.PointLight(0xFFEE44,1.5,25); sl.userData.noclick=true; add(sl);
  camera.position.set(5,20,38); controls.target.set(0,0,0);
  controls.minDistance=0.5; controls.maxDistance=70;
  document.getElementById('obj-count').textContent=`${STARS.length} stellar objects · within 20 ly`;
}

// ─────────────────────────────────────────────
// BUILD SOLAR SYSTEM
// ─────────────────────────────────────────────
function auScale(au){return au<4.5?au*4.5:4.5*4.5+(au-4.5)*1.4;}

function buildSolar(){
  clear();
  // Sun
  const sunM=sphere(1.8,'#FFEE44',16); sunM.userData={...PLANETS.find(p=>false)||{},
    name:'Sun',type:'G2V – Yellow Dwarf',col:'#FFEE44',
    desc:'Our host star. 4.6 billion years old. Contains 99.86% of the solar system mass. Diameter 1.4 million km. Surface temperature 5,778 K.',
    stats:{"Mass":"1 M☉","Radius":"696,000 km","Temp":"5,778 K","Age":"4.6 Gyr"},_pos:new THREE.Vector3()};
  add(sunM);
  add(glow(new THREE.Vector3(),'#FFEE44',6));
  add(label('Sun',0,2.5,0,'#FFEE44',0.8));
  const sl=new THREE.PointLight(0xFFEE44,2.5,300); sl.userData.noclick=true; add(sl);
  add(new THREE.AmbientLight(0x112233,0.4)).userData={noclick:true};

  const angles=[0.6,1.4,2.2,3.1,0.2,1.0,2.5,3.8,4.5,5.2,0.9,1.8,2.7,4.1];
  PLANETS.forEach((p,i)=>{
    const r=auScale(p.au);
    const ang=angles[i]||i*0.7;
    let x,z;
    if(p.name==='3I/ATLAS ★'){x=r*0.6;z=r*0.8;}
    else{x=r*Math.cos(ang);z=r*Math.sin(ang);}
    // orbit ring
    if(p.name!=='3I/ATLAS ★') add(ring(r,0x1a2a3a,0.5));
    const ds=Math.max(0.18,Math.min(p.sz*0.13,1.3));
    const m=sphere(ds,p.col,12);
    m.position.set(x,0,z);
    m.userData={...p,_pos:new THREE.Vector3(x,0,z)};
    // Saturn rings
    if(p.name==='Saturn'){
      const rg=new THREE.Mesh(new THREE.RingGeometry(ds*1.5,ds*2.4,36),
        new THREE.MeshBasicMaterial({color:0xCCAA55,side:THREE.DoubleSide,transparent:true,opacity:0.55}));
      rg.rotation.x=-Math.PI/2.6; rg.userData.noclick=true;
      const g=new THREE.Group(); g.add(m); g.add(rg);
      g.position.set(x,0,z); g.userData=m.userData; g.userData._pos=new THREE.Vector3(x,0,z);
      m.position.set(0,0,0);
      add(g);
    } else { add(m); }
    if(p.name==='3I/ATLAS ★') add(glow(new THREE.Vector3(x,0,z),'#00FFAA',ds*5));
    add(label(p.name,x,ds+0.6,z,p.col,0.55));
  });

  // Asteroid belt
  const ab=new THREE.Mesh(new THREE.RingGeometry(auScale(2.1),auScale(3.3),80),
    new THREE.MeshBasicMaterial({color:0x443322,side:THREE.DoubleSide,transparent:true,opacity:0.2}));
  ab.rotation.x=-Math.PI/2; ab.userData.noclick=true; add(ab);
  add(label('Asteroid Belt',auScale(2.7)+0.4,0.3,0,'#665533',0.5));

  // Kuiper Belt
  const kb=new THREE.Mesh(new THREE.RingGeometry(auScale(30),auScale(50),80),
    new THREE.MeshBasicMaterial({color:0x223344,side:THREE.DoubleSide,transparent:true,opacity:0.18}));
  kb.rotation.x=-Math.PI/2; kb.userData.noclick=true; add(kb);
  add(label('Kuiper Belt',auScale(40)+0.5,0.3,0,'#334455',0.5));

  camera.position.set(0,55,90); controls.target.set(0,0,0);
  controls.minDistance=2; controls.maxDistance=350;
  document.getElementById('obj-count').textContent=`${PLANETS.length} solar system objects · 1I/ʻOumuamua, 2I/Borisov, 3I/ATLAS`;
}

// ─────────────────────────────────────────────
// BUILD GALAXY SCALE
// ─────────────────────────────────────────────
function buildGalaxy(){
  clear();
  // Milky Way disk
  const disk=new THREE.Mesh(new THREE.RingGeometry(3000,50000,80),
    new THREE.MeshBasicMaterial({color:0x223355,side:THREE.DoubleSide,transparent:true,opacity:0.12}));
  disk.rotation.x=-Math.PI/2; disk.userData.noclick=true; add(disk);
  // Inner bulge
  add(glow(new THREE.Vector3(),'#FF8800',12000));

  for(const d of DEEP){
    const pos=new THREE.Vector3(d.x,d.y,d.z);
    const m=sphere(d.sz,d.col,8); m.position.copy(pos);
    m.userData={...d,_pos:pos.clone()}; add(m);
    add(glow(pos,d.col,d.sz*4));
    add(label(d.name,d.x,d.y+d.sz*2,d.z,d.col,d.sz/800));
  }
  // Orion Arm indicator
  const pts=[new THREE.Vector3(18000,0,-8000),new THREE.Vector3(22000,0,-3000),
    new THREE.Vector3(26700,0,0),new THREE.Vector3(31000,0,5000),new THREE.Vector3(36000,0,11000)];
  const armG=new THREE.BufferGeometry().setFromPoints(new THREE.CatmullRomCurve3(pts).getPoints(60));
  const armL=new THREE.Line(armG,new THREE.LineBasicMaterial({color:0x335566,transparent:true,opacity:0.5}));
  armL.userData.noclick=true; add(armL);
  add(label('Orion Arm',31000,1000,7000,'#335566',15));
  add(label('Milky Way\n(100,000 ly dia.)',0,-6000,0,'#556688',40));

  camera.position.set(0,80000,120000); controls.target.set(0,0,0);
  controls.minDistance=500; controls.maxDistance=600000;
  document.getElementById('obj-count').textContent=`Galaxy scale · Milky Way + Local Group neighbors`;
}

// ─────────────────────────────────────────────
// CLICK / TAP
// ─────────────────────────────────────────────
function pick(cx,cy){
  mouse.x=(cx/innerWidth)*2-1; mouse.y=-(cy/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(sceneObjects.filter(o=>o.isMesh&&!o.userData.noclick&&o.userData.name),true);
  if(!hits.length){closePanel();return;}
  let obj=hits[0].object;
  while(obj&&!obj.userData.name&&obj.parent)obj=obj.parent;
  if(obj&&obj.userData.name)showPanel(obj.userData);
  else closePanel();
}

let lastT=0;
function onTouch(e){
  const now=Date.now(); if(now-lastT<400)return; lastT=now;
  if(e.changedTouches&&e.changedTouches.length)pick(e.changedTouches[0].clientX,e.changedTouches[0].clientY);
}
function onClick(e){if(e.pointerType==='touch')return; pick(e.clientX,e.clientY);}

// ─────────────────────────────────────────────
// INFO PANEL
// ─────────────────────────────────────────────
function showPanel(d){
  document.getElementById('pname').textContent=d.name||'';
  document.getElementById('ptype').textContent=d.type||'';
  document.getElementById('pdesc').textContent=d.desc||'';
  const st=document.getElementById('pstats'); st.innerHTML='';
  if(d.stats)for(const[k,v]of Object.entries(d.stats))
    st.innerHTML+=`<div class="sbox"><div class="slbl">${k}</div><div class="sval">${v}</div></div>`;
  document.getElementById('panel').classList.add('open');
}
function closePanel(){document.getElementById('panel').classList.remove('open');}

// ─────────────────────────────────────────────
// MODE
// ─────────────────────────────────────────────
function setMode(m){
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+m).classList.add('active');
  closePanel();
  if(m==='solar')buildSolar();
  else if(m==='stars')buildStars();
  else buildGalaxy();
}

function onResize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}

function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
</script>
